<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>With Bader — page loader (drop-in)</title>
<style>
  html,body{margin:0;height:100%}
  /* ============ COPY FROM HERE ============ */
  #wb-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:#f5f8fb;transition:opacity .45s ease,visibility .45s ease}
  #wb-loader.wb-done{opacity:0;visibility:hidden}
  #wb-loader .wb-stack{display:flex;flex-direction:column;align-items:center;gap:30px}
  #wb-loader .wb-dots{display:flex;gap:9px}
  #wb-loader .wb-dots i{width:7px;height:7px;border-radius:50%;background:#20BCCE;animation:wb-dots 1.4s ease-in-out infinite}
  #wb-loader .wb-dots i:nth-child(2){animation-delay:.18s}
  #wb-loader .wb-dots i:nth-child(3){animation-delay:.36s}
  @keyframes wb-snake{0%{stroke-dashoffset:1}45%,55%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
  @keyframes wb-bar{0%,12%{transform:scaleX(0);opacity:0}30%,62%{transform:scaleX(1);opacity:1}86%,100%{transform:scaleX(0);opacity:0}}
  @keyframes wb-wedge{0%,20%{transform:scale(0);opacity:0}34%,66%{transform:scale(1);opacity:1}88%,100%{transform:scale(0);opacity:0}}
  @keyframes wb-word{0%,20%{opacity:0;transform:translateY(14px)}40%,70%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(-8px)}}
  @keyframes wb-dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #wb-loader *{animation:none !important}
    #wb-loader .wb-word{opacity:1;transform:none}
  }
  /* ============ TO HERE ============ */
  main{min-height:100%;display:grid;place-items:center;font:16px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#113b69;background:#fff}
</style>
</head>

<script>
// Hides the loader once the page is ready. MIN_MS keeps one full loop visible on fast loads.
(function(){
  var MIN_MS = 1200, el = document.getElementById('wb-loader'), t0 = Date.now();
  function hide(){
    setTimeout(function(){
      el.classList.add('wb-done');
      setTimeout(function(){ el.remove(); }, 500);
    }, Math.max(0, MIN_MS - (Date.now() - t0)));
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
})();
</script>
